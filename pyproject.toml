[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.2",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "base-aprs-client"
description = "Base layer for building more complex APRS interactions with python."
authors = [
    {name = "Masen Furer KF7HVM", email = "kf7hvm@0x26.net"},
]
requires-python = ">=3.11"
dependencies = [
    "aprs3 >= 8.0.0",
    "attrs > 20",
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications :: Ham Radio",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords=[
    'Ham Radio', 'APRS',
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/python-aprs/base-aprs-client"


[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "ruff>=0.17",
    "ty==0.0.107",
]

[tool.setuptools_scm]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is the formatter's job
    "UP031",  # %-formatting is the only option for bytes
]
extend-safe-fixes = ["UP028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "--cov=base_aprs_client --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90

[tool.ty.environment]
python-version = "3.11"
